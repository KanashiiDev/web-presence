name: Crowdin

on:
  push:
    branches:
      - main
    paths:
      - 'locales/en/**'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode'
        required: true
        default: 'upload'
        type: choice
        options:
          - upload
          - download
          - upload-translations

jobs:
  upload-sources:
    name: Upload Sources
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'upload')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: crowdin/github-action@v2
        with:
          upload_sources: true
          upload_translations: false
          download_translations: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: 917965
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

  upload-translations:
    name: Upload Existing Translations
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'upload-translations'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: crowdin/github-action@v2
        with:
          upload_sources: false
          upload_translations: true
          download_translations: false
          import_eq_suggestions: false
          auto_approve_imported: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: 917965
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

  download-translations:
    name: Download Translations
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'download'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: crowdin/github-action@v2
        with:
          upload_sources: false
          upload_translations: false
          download_translations: true
          create_pull_request: true
          pull_request_title: 'Crowdin Translation Sync'
          pull_request_body: 'New translations synced from Crowdin.'
          pull_request_base_branch_name: 'main'
          localization_branch_name: 'l10n_main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: 917965
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
