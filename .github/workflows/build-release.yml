name: Electron Build & Release

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:
    inputs:
      platform:
        description: "Select the Platform to Compile"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - linux-only
          - linux-anylinux-only
          - windows-only
          - macos-only

permissions:
  contents: write

jobs:
  build-win:
    name: Build Windows
    if: github.event_name == 'push' || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'windows-only'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Windows
        run: npm run build:win

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist
          retention-days: 5

  build-linux:
    name: Build Linux
    if: github.event_name == 'push' || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'linux-only'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Linux
        run: npm run build:linux

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: dist/**
          retention-days: 5

  build-linux-deb:
    name: Build Linux (deb only)
    if: github.event.inputs.platform == 'linux-anylinux-only'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build deb
        run: npm run build:deb

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb-build
          path: dist/**/*.deb
          retention-days: 5

  build-linux-anylinux:
    name: Build Linux (anylinux AppImage)
    needs: [build-linux, build-linux-deb]
    if: |
      always() &&
      (github.event_name == 'push' ||
      github.event.inputs.platform == 'all' ||
      github.event.inputs.platform == 'linux-only' ||
      github.event.inputs.platform == 'linux-anylinux-only') &&
      (needs.build-linux.result == 'success' || needs.build-linux.result == 'skipped') &&
      (needs.build-linux-deb.result == 'success' || needs.build-linux-deb.result == 'skipped') &&
      (needs.build-linux.result == 'success' || needs.build-linux-deb.result == 'success')
    runs-on: ubuntu-latest
    container: ghcr.io/pkgforge-dev/archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparing Container
        uses: pkgforge-dev/anylinux-setup-action@v2

      - name: Download Linux build artifact
        if: needs.build-linux.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: ./dist

      - name: Download deb artifact
        if: needs.build-linux-deb.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: linux-deb-build
          path: ./dist

      - name: Build Anylinux AppImage
        env:
          DISPLAY: ":99"
          HOME: /root
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          LOCAL_DEB_DIR: "./dist"
        run: |
          Xvfb :99 -screen 0 1024x768x24 -ac &
          XVFB_PID=$!
          chmod +x scripts/build-anylinux-appimage.sh
          bash scripts/build-anylinux-appimage.sh
          kill $XVFB_PID 2>/dev/null || true

      - name: Upload anylinux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-anylinux-build
          path: dist/anylinux/*.AppImage*
          retention-days: 5

  build-mac:
    name: Build macOS
    if: github.event_name == 'push' || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'macos-only'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install dmg-license
        run: npm install --no-save dmg-license

      - name: Build macOS App
        run: npm run build:mac:universal

      - name: Upload Mac Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: dist
          retention-days: 5

  create-release:
    name: Create GitHub Release
    needs: [build-win, build-linux, build-linux-deb, build-linux-anylinux, build-mac]
    if: |
      always() &&
      (needs.build-win.result == 'success' || needs.build-win.result == 'skipped') &&
      (needs.build-linux.result == 'success' || needs.build-linux.result == 'skipped') &&
      (needs.build-linux-deb.result == 'success' || needs.build-linux-deb.result == 'skipped') &&
      (needs.build-linux-anylinux.result == 'success' || needs.build-linux-anylinux.result == 'skipped' || needs.build-linux-anylinux.result == 'failure') &&
      (needs.build-mac.result == 'success' || needs.build-mac.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      x64_sha256: ${{ steps.hashes.outputs.x64_sha256 }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: get_version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download Windows Artifacts
        if: needs.build-win.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: ./dist

      - name: Download Linux Artifacts
        if: needs.build-linux.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: ./dist

      - name: Download Linux anylinux Artifacts
        if: needs.build-linux-anylinux.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: linux-anylinux-build
          path: ./dist/anylinux

      - name: Download Mac Artifacts
        if: needs.build-mac.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: macos-build
          path: ./dist

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prepare Release
        run: npm run prepare-release

      - name: Rename pacman artifact
        run: |
          cd release
          for f in *.pacman; do
            [ -e "$f" ] || continue
            mv "$f" "${f%.pacman}.pkg.tar.zst"
          done

      - name: Compute hashes
        id: hashes
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          X64="release/web-presence-${VERSION}-x86_64.AppImage"
          if [ -f "$X64" ]; then
            SRI_HASH="sha256-$(openssl dgst -binary -sha256 "$X64" | base64)"
            echo "x64_sha256=$SRI_HASH" >> "$GITHUB_OUTPUT"
          else
            echo "x64_sha256=" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          files: |
            release/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-nix:
    name: Update Nix Hashes
    needs: create-release
    runs-on: ubuntu-latest
    if: always() && needs.create-release.result == 'success' && github.event.inputs.platform != 'linux-anylinux-only' && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Patch nix/package.nix
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
          X64_SHA256: ${{ needs.create-release.outputs.x64_sha256 || '' }}
        run: |
          python3 scripts/updateNixHashes.py \
            --file nix/package.nix \
            --version "$VERSION" \
            ${X64_SHA256:+--x64 "$X64_SHA256"}

      - name: Commit
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet nix/package.nix && echo "nothing to commit" && exit 0
          git add nix/package.nix
          git commit -m "chore(nix): update hashes for ${VERSION} [skip ci]"
          git push origin main
