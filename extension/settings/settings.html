<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title data-i18n="settings.title">Web Presence - Settings</title>
    <link rel="stylesheet" href="settings.css" />
    <link rel="stylesheet" href="../libs/simplebar.css" />
  </head>
  <div id="bg-layer"></div>
  <body data-theme="dark">
    <div class="header">
      <div>
        <h3 data-i18n="settings.title">Web Presence - Settings</h3>
        <p class="header-desc" data-i18n="settings.desc">Manage your Web Presence settings!</p>
      </div>
      <button id="btnToggleView" class="library-btn btn btn-secondary" style="visibility: hidden">
        <span id="btnToggleViewLabel"></span>
      </button>
    </div>

    <!-- Backup Section -->
    <div class="container" data-section="backup">
      <div class="content card card-md backup">
        <div class="buttons">
          <button class="btn btn-secondary" id="exportBtn" data-i18n="backup.export">Export Backup</button>
          <button class="btn btn-secondary" id="importBtn" data-i18n="backup.restore">Import Backup</button>
          <button class="btn btn-secondary" id="syncBtn" data-i18n="backup.syncBtn" style="display: none">Sync History Between App & Extension</button>
        </div>
      </div>
    </div>

    <!-- Filters Section -->
    <div class="container" data-section="filter">
      <div class="filter-actions-header">
        <div id="filterTabsContainer"></div>
        <div id="filterSearchContainer"></div>
        <div>
          <button class="btn btn-primary" id="toggleFormBtn" data-i18n="filter.addNew">+ Add New Filter</button>
          <button class="btn btn-primary" id="openHistoryBtn" data-i18n="button.open_history">Open History</button>
          <button class="btn btn-primary" id="getActivityInfoBtn">
            <span class="btn-text" data-i18n="filter.blockCurrent">Block Current Activity</span>
          </button>
        </div>
      </div>

      <div class="content card card-md filter">
        <div class="form-container" id="formContainer">
          <div class="entries-container">
            <div id="filterModeContainer"></div>
            <div id="entriesList"></div>
            <button class="btn btn-sm" id="addEntryBtn" data-i18n="filter.add">Add Entry</button>
            <button class="btn btn-sm" id="fillFormBtn" data-i18n="filter.fillWithCurrent">Fill with Current Activity</button>
            <div class="all-parsers-container" id="allParsersContainer"></div>
          </div>
          <div class="parser-list" id="parserList"></div>
          <div class="form-actions">
            <button class="btn btn-primary btn-sm" id="saveFilterBtn" data-i18n="common.save">Save</button>
            <button class="btn btn-secondary btn-sm" id="cancelBtn" data-i18n="common.cancel">Cancel</button>
          </div>
        </div>
        <div class="filters-list">
          <div id="filtersList"></div>
        </div>
      </div>
    </div>

    <!-- Activity Priority Section -->
    <div class="container" data-section="priority">
      <div class="filter-actions-header">
        <div id="prioritySearchContainer"></div>
      </div>

      <div class="content card card-md priority">
        <div class="priority-columns">
          <div class="priority-column">
            <h3 class="priority-column-title" data-i18n="settings.priority.sitesTitle"></h3>
            <div class="priority-list" id="prioritySourceList">
              <div class="empty-state" data-i18n="settings.priority.empty">No activity sites detected yet.</div>
            </div>
          </div>

          <div class="priority-column">
            <h3 class="priority-column-title" data-i18n="settings.priority.orderTitle"></h3>
            <div class="priority-list dropzone" id="priorityList">
              <div class="empty-state" data-i18n="settings.priority.dropzone">Drag sites here to prioritize them.</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Debug Logs Section -->
    <div class="container" data-section="debug">
      <div class="content card card-md debug-section">
        <!-- Tab switcher -->
        <div class="debug-tab-bar">
          <button class="btn debug-tab-btn active" data-tab="logs" data-i18n="debug.tab.logs">Logs</button>
          <button class="btn debug-tab-btn" data-tab="activity" data-i18n="debug.tab.activity">Recent Activity</button>
        </div>

        <!-- Logs panel -->
        <div class="debug-panel" data-panel="logs">
          <div class="debug-toolbar">
            <div class="debug-filters">
              <button class="btn debug-filter-btn active" data-level="all" data-i18n="common.all">All</button>
              <button class="btn debug-filter-btn" data-level="info" data-i18n="debug.filter.info">Info</button>
              <button class="btn debug-filter-btn" data-level="warn" data-i18n="debug.filter.warn">Warn</button>
              <button class="btn debug-filter-btn" data-level="error" data-i18n="userscript.export.status.error">Error</button>
            </div>
            <div class="debug-actions">
              <button class="btn btn-primary" id="debugRefreshBtn" data-i18n="debug.refresh">Refresh</button>
              <button class="btn btn-primary" id="debugExportBtn" data-i18n="userscript.listControls.export">Export Logs</button>
              <button class="btn btn-danger" id="debugClearBtn" data-i18n="debug.clear">Clear Debug Logs</button>
            </div>
            <div class="debug-toolbar-bottom">
              <span class="debug-search-wrapper main">
                <input class="debug-search input" id="debugSearch" type="text" placeholder="Search logs…" data-i18n="debug.search.placeholder" />
                <span id="debugSearchResetBtn" data-i18n="debug.clearSearch" data-i18n-attr="title" title="Clear Search" style="display: none"></span>
              </span>
              <span id="debugFiltersToggleBtn" data-i18n="settings.filter.title" data-i18n-attr="title" title="Filters"></span>
              <span class="debug-search-wrapper">
                <input
                  class="debug-filter-input input"
                  id="debugTabIdFilter"
                  type="text"
                  placeholder="Filter by Tab ID"
                  data-i18n="debug.filter.tabId"
                  style="display: none"
                />
                <span id="debugTabIdResetBtn" data-i18n="debug.clearTabId" data-i18n-attr="title" title="Clear Tab ID Filter" style="display: none"></span>
              </span>
              <span class="debug-search-wrapper">
                <input
                  class="debug-filter-input input"
                  id="debugHostnameFilter"
                  type="text"
                  placeholder="Filter by Hostname"
                  data-i18n="debug.filter.hostname"
                  style="display: none"
                />
                <span id="debugHostnameResetBtn" data-i18n="debug.clearHostname" data-i18n-attr="title" title="Clear Hostname Filter" style="display: none"></span>
              </span>
            </div>
          </div>

          <div id="summaryErrorList" class="summary-error-list"></div>

          <div class="debug-stats" id="debugStats"></div>

          <div class="debug-log-wrapper" style="position: relative; display: flex">
            <div class="debug-log-container" id="debugLogContainer" style="flex-grow: 1">
              <div class="debug-empty" id="debugEmpty" data-i18n="common.empty">Empty</div>
              <div id="debugLogList"></div>
            </div>

            <div class="debug-minimap" id="debugMinimap"></div>
          </div>
        </div>

        <!-- Activity panel -->
        <div class="debug-panel" data-panel="activity" style="display: none">
          <div class="debug-toolbar">
            <div class="debug-filters">
              <button class="btn debug-filter-btn active" data-level="all" data-i18n="common.all">All</button>
              <button class="btn debug-filter-btn" data-level="info" data-i18n="debug.filter.info">Info</button>
              <button class="btn debug-filter-btn" data-level="warn" data-i18n="debug.filter.warn">Warn</button>
              <button class="btn debug-filter-btn" data-level="error" data-i18n="userscript.export.status.error">Error</button>
            </div>
            <div class="debug-actions">
              <button class="btn btn-danger" id="activityClearBtn" data-i18n="debug.clear">Clear</button>
            </div>
            <span class="debug-search-wrapper activity">
              <input class="debug-search input" id="activitySearch" type="text" placeholder="Search activity…" data-i18n="debug.search.placeholder" />
              <span id="activitySearchResetBtn" data-i18n="debug.clearSearch" data-i18n-attr="title" title="Clear Search" style="display: none"></span>
            </span>
          </div>

          <div class="debug-stats" id="activityStats"></div>

          <div class="debug-log-container" id="activityLogContainer">
            <div class="debug-empty" id="activityEmpty" data-i18n="common.empty">Empty.</div>
            <div id="activityLogList"></div>
          </div>
        </div>
      </div>
    </div>

    <script src="../libs/browser-polyfill.js"></script>
    <script src="../libs/simplebar.js"></script>
    <script src="../libs/pako.js"></script>
    <script src="../common/utils.js"></script>
    <script src="settings-debug.js"></script>
    <script src="settings.js"></script>
  </body>
</html>
